name: build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/gvtlabs/ffmpeg

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      ffmpeg: ${{ steps.v.outputs.ffmpeg }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          . ./versions.env
          echo "ffmpeg=$FFMPEG_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # v<ffmpeg version>, or v<ffmpeg version>-<n> to rebuild the same
            # ffmpeg with changed libraries.
            case "$GITHUB_REF_NAME" in
              "v$FFMPEG_VERSION" | "v$FFMPEG_VERSION"-[0-9]*) ;;
              *) echo "::error::tag $GITHUB_REF_NAME does not match FFMPEG_VERSION=$FFMPEG_VERSION"; exit 1 ;;
            esac
            echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # The Dockerfile's build stage runs build.sh and test.sh on Alpine.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: dist
          outputs: type=local,dest=out
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}

      - name: Test on glibc distros
        run: |
          for img in debian:trixie-slim debian:bookworm-slim ubuntu:24.04; do
            echo "::group::$img"
            docker run --rm -v "$PWD:/w" -w /w "$img" ./test.sh out/bin
            echo "::endgroup::"
          done

      - name: Package
        run: ./package.sh out linux ${{ matrix.arch }} dist

      - uses: actions/upload-artifact@v7
        with:
          name: tarball-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      - if: needs.version.outputs.release
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed untagged; the release job tags the multi-arch manifest once
      # every platform has built and passed its tests.
      - if: needs.version.outputs.release
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: image
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.release }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=linux-${{ matrix.arch }}

      - if: needs.version.outputs.release
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - if: needs.version.outputs.release
        uses: actions/upload-artifact@v7
        with:
          name: digest-linux-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: brew install cmake meson nasm ninja pkgconf
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - if: needs.version.outputs.release
        run: ./package.sh source dist
      - run: ./build.sh out
      - run: ./test.sh out/bin
      - run: ./package.sh out macos arm64 dist
      - uses: actions/upload-artifact@v7
        with:
          name: tarball-macos-arm64
          path: dist/
          if-no-files-found: error

  release:
    if: needs.version.outputs.release
    needs: [version, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        working-directory: digests
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create -t "$IMAGE:$RELEASE" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$RELEASE"
        env:
          RELEASE: ${{ needs.version.outputs.release }}

      - name: Create release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ffmpeg $RELEASE" \
            --notes "Static ffmpeg and ffprobe $FFMPEG for linux x86_64, linux arm64 and macOS arm64. Library versions are in [versions.env](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/versions.env).

          The binaries are licensed under GPL-3.0-or-later; \`ffmpeg-$FFMPEG-source.tar.xz\` in this release contains the complete corresponding source.

          Docker: \`COPY --from=$IMAGE:$RELEASE /ffmpeg /ffprobe /usr/local/bin/\`"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.version.outputs.release }}
          FFMPEG: ${{ needs.version.outputs.ffmpeg }}
